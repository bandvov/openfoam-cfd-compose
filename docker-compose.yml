# Settings are read from .env (copy .env.example to .env). Docker Compose uses
# .env for ${VAR} substitution below; it does NOT inject .env into the container
# by itself, so every variable run.py reads must be listed here. An empty
# default (${VAR:-}) means "let run.py decide".
services:
  cfd:
    build:
      context: .
      args:
        OPENFOAM_IMAGE_TAG: ${OPENFOAM_IMAGE_TAG:-2506-oe2403sp2}
    container_name: openfoam-cfd
    working_dir: /workspace
    shm_size: 4gb
    volumes:
      - ./:/workspace
    environment:
      CASE_NAME: ${CASE_NAME:-aircraft}
      GEOMETRY: ${GEOMETRY:-/workspace/geometry/model2.stl}
      MODEL_UNITS: ${MODEL_UNITS:-mm}
      MESH_SCALE: ${MESH_SCALE:-}
      SPEED: ${SPEED:-30}
      ANGLE_OF_ATTACK: ${ANGLE_OF_ATTACK:-0}
      AIR_DENSITY: ${AIR_DENSITY:-1.225}
      KINEMATIC_VISCOSITY: ${KINEMATIC_VISCOSITY:-1.5e-5}
      CHORD: ${CHORD:-auto}
      WING_AREA: ${WING_AREA:-auto}
      TURBULENCE_INTENSITY: ${TURBULENCE_INTENSITY:-0.01}
      MAX_ITER: ${MAX_ITER:-2000}
      MESH_QUALITY: ${MESH_QUALITY:-medium}
      LAYERS: ${LAYERS:-}
      WAKE_LEVEL: ${WAKE_LEVEL:-}
      NPROCS: ${NPROCS:-1}
      MPIRUN_ARGS: ${MPIRUN_ARGS:-}
      BACKGROUND_CELLS_PER_LENGTH: ${BACKGROUND_CELLS_PER_LENGTH:-}
      MAX_BACKGROUND_NX: ${MAX_BACKGROUND_NX:-}
      MAX_BACKGROUND_NY: ${MAX_BACKGROUND_NY:-}
      MAX_BACKGROUND_NZ: ${MAX_BACKGROUND_NZ:-}
      MAX_GLOBAL_CELLS: ${MAX_GLOBAL_CELLS:-}
      MAX_LOCAL_CELLS: ${MAX_LOCAL_CELLS:-}
      SURFACE_REFINEMENT_MIN: ${SURFACE_REFINEMENT_MIN:-}
      SURFACE_REFINEMENT_MAX: ${SURFACE_REFINEMENT_MAX:-}
      OPENFOAM_BASHRC: ${OPENFOAM_BASHRC:-}
