# Renders images from the CFD results. Run the solver first
# (docker compose up --build in the repo root); it writes ../results/<CASE_NAME>/.
# Images: <case>_U_z.png (top view), <case>_U_y.png and <case>_p_y.png (side view,
# mid-span), <case>_psurf.png (surface pressure) and <case>_streamlines.png
# (3D + surface streamlines), saved in ../results/.
# CASE_NAME / ZOOM come from the shell or a paraview/.env file, e.g.
#   CASE_NAME=run2 ZOOM=full docker compose up
# Needs an NVIDIA GPU + NVIDIA Container Toolkit and access to nvcr.io.
services:
  paraview:
    image: nvcr.io/nvidia-hpcvis/paraview:egl-py3-5.11.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - ../results:/results
      - ./scripts:/scripts

    environment:
      CASE_FILE: /results/${CASE_NAME:-aircraft}/case.foam
      OUTPUT_DIR: /results
      ZOOM: ${ZOOM:-body}

    command:
      - sh
      - -c
      - |
        for v in "U z" "U y" "p y" "psurf z" "streamlines z"; do
          set -- $$v
          FIELD=$$1 SLICE_AXIS=$$2 pvpython /scripts/visualize.py || exit 1
        done

    shm_size: 8gb
